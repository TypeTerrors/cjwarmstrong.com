name: Deploy to Vercel

on:
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - ".github/**"
      - ".env.example"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_CLI_VERSION: 55.0.0

jobs:
  deploy-preview:
    name: Deploy preview
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_DEV_DOMAIN: ${{ secrets.VERCEL_DEV_DOMAIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}

      - name: Pull Vercel preview environment
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build preview
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy preview
        id: deploy
        run: |
          deployment_url="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Alias preview domain
        run: vercel alias set "${{ steps.deploy.outputs.deployment_url }}" "$VERCEL_DEV_DOMAIN" --token="$VERCEL_TOKEN"

      - name: Generate preview tag
        id: preview-tag
        if: github.event_name == 'push'
        run: |
          tag_name="preview-$(date -u +'%Y%m%d%H%M%S')-${GITHUB_SHA::7}"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"

      - name: Create preview tag
        if: github.event_name == 'push'
        env:
          TAG_NAME: ${{ steps.preview-tag.outputs.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" -m "Preview deployment $TAG_NAME"
          git push origin "$TAG_NAME"

      - name: Deployment summary
        run: |
          {
            echo "### Preview deployed"
            echo ""
            echo "- Vercel deployment: ${{ steps.deploy.outputs.deployment_url }}"
            echo "- Preview domain alias configured"
            if [ -n "${{ steps.preview-tag.outputs.tag_name }}" ]; then
              echo "- Tag: ${{ steps.preview-tag.outputs.tag_name }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Deploy production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}

      - name: Pull Vercel production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production
        id: deploy
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Generate release tag
        id: release-tag
        if: github.event_name == 'push'
        run: |
          tag_name="release-$(date -u +'%Y%m%d%H%M%S')-${GITHUB_SHA::7}"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        if: github.event_name == 'push'
        env:
          TAG_NAME: ${{ steps.release-tag.outputs.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" -m "Production release $TAG_NAME"
          git push origin "$TAG_NAME"

      - name: Generate release notes summary
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY is not set; release will be created without notes."
            exit 0
          fi

          previous_tag="$(git tag --list 'release-*' --sort=-creatordate | grep -v "^${{ steps.release-tag.outputs.tag_name }}$" | head -n 1 || true)"

          if [ -n "$previous_tag" ]; then
            git log --format='- %s (%h)' "$previous_tag"..HEAD > /tmp/release-commits.md
            git diff --stat "$previous_tag"..HEAD > /tmp/release-diffstat.txt
          else
            git log --format='- %s (%h)' HEAD > /tmp/release-commits.md
            git diff --stat HEAD~1..HEAD > /tmp/release-diffstat.txt 2>/dev/null || true
          fi

          {
            echo "Deployment URL: $DEPLOYMENT_URL"
            echo ""
            echo "Commits:"
            cat /tmp/release-commits.md
            echo ""
            echo "Diff stat:"
            cat /tmp/release-diffstat.txt
          } > /tmp/release-context.md

          node <<'NODE'
          const fs = require("node:fs");

          const context = fs.readFileSync("/tmp/release-context.md", "utf8");
          const prompt = [
            "Write brief GitHub release notes in Markdown for a production website deployment.",
            "Use plain English for a non-technical reader.",
            "Keep it to 2-4 bullets under the heading \"## Summary\".",
            "Mention the deployment URL once at the end under \"## Deployment\".",
            "Do not invent details that are not supported by the commit list or diffstat.",
            "",
            context.slice(0, 60000),
          ].join("\n");

          async function main() {
            const response = await fetch("https://api.openai.com/v1/responses", {
              method: "POST",
              headers: {
                "Authorization": `Bearer ${process.env.OPENAI_API_KEY}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                model: "gpt-5.4-mini",
                input: prompt,
                max_output_tokens: 500,
                store: false,
              }),
            });

            if (!response.ok) {
              throw new Error(`OpenAI request failed with status ${response.status}: ${await response.text()}`);
            }

            const data = await response.json();
            const notes = data.output_text?.trim();

            if (!notes) {
              throw new Error("OpenAI response did not include output_text.");
            }

            fs.writeFileSync("release-notes.md", `${notes}\n`);
          }

          main().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release-tag.outputs.tag_name }}
        run: |
          if [ -s release-notes.md ]; then
            gh release create "$TAG_NAME" \
              --verify-tag \
              --title "$TAG_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$TAG_NAME" \
              --verify-tag \
              --title "$TAG_NAME" \
              --notes ""
          fi

      - name: Deployment summary
        run: |
          {
            echo "### Production deployed"
            echo ""
            echo "- Vercel deployment: ${{ steps.deploy.outputs.deployment_url }}"
            if [ -n "${{ steps.release-tag.outputs.tag_name }}" ]; then
              echo "- Tag: ${{ steps.release-tag.outputs.tag_name }}"
              echo "- Release: ${{ steps.release-tag.outputs.tag_name }}"
              if [ -s release-notes.md ]; then
                echo "- Release notes: generated with OpenAI"
              else
                echo "- Release notes: skipped"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
